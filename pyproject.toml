[project]
name = "so101-control"
version = "0.1.0"
description = "SO101 Robot Arm Control System"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "feetech-servo-sdk>=1.0.0",
    "mcp[cli]>=1.25.0",
    "opencv-python>=4.12.0.88",
    "pyserial>=3.5",
    "pyyaml>=6.0.3"
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
